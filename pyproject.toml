[project]
name = "movies"
version = "0.1.0"
description = "Semantic Movie Discovery and Recommendation API"

authors = [{ name = "a5chin", email = "a5chin.origin+contact@gmail.com" }]
maintainers = [{ name = "a5chin", email = "a5chin.origin+contact@gmail.com" }]

requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }

dependencies = [
    "beartype>=0.22.9",
    "bm25s>=0.3.3",
    "cinemagoer>=2023.5.1",
    "datasets>=4.8.4",
    "dspy>=3.1.3",
    "fastapi>=0.115.0",
    "google-cloud-logging>=3.15.0",
    "google-genai>=2.0.1",
    "httpx>=0.28.0",
    "imdbinfo>=0.8.3",
    "jaxtyping>=0.3.6",
    "kagglehub>=1.0.1",
    "numpy>=2.2.0",
    "openai>=1.82.0",
    "polars>=1.40.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pymoviedb>=0.1.2",
    "pymupdf>=1.27.2.3",
    "pymupdf4llm>=1.27.2.3",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=5.4.1",
    "spacy>=3.8.14",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "cookiecutter>=2.6.0",
    "cookiecutter-data-science>=2.3.0",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "mkdocs-material>=9.7.6",
    "nox>=2025.11.12",
    "pre-commit>=4.5.1",
    "pymupdf>=1.27.2.3",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.14",
    "sqlfluff>=4.0.0",
    "ty>=0.0.35",
]

[tool.hatch.build.targets.wheel]
packages = ["tools", "src", "src/movies"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
